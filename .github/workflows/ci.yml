# ============================================================
#  Integração contínua: roda em todo push e pull request.
#
#  A ordem é deliberada — as verificações baratas e mais específicas primeiro,
#  para que um erro de lint não custe um build inteiro para aparecer.
# ============================================================
name: CI — lint, tipos, testes e build

on:
  push:
    branches: [main]
  pull_request:
  # Botão "Run workflow" na aba Actions. Sem isto não há como re-executar a
  # verificação sem um commit novo — e apagar uma run leva junto o "Re-run".
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # O `.gitmodules` usa URLs SSH (git@github.com:), que o runner não tem
      # chave para resolver. A regra geral é reescrever para HTTPS e deixar o
      # token do Actions autenticar — o que basta para submodule PÚBLICO.
      #
      # O `tachyon-design` é privado, e aí a regra geral não serve: o token do
      # Actions só enxerga ESTE repositório, então o clone volta 404 ("not
      # found", e não "forbidden", porque o GitHub não confirma a existência de
      # repositório privado). Ele fica em SSH, com uma deploy key de leitura
      # própria, atrás de um alias de host — assim a chave vale só para ele e
      # nenhum outro clone SSH a usa por engano.
      #
      # As duas regras convivem porque o git desempata `insteadOf` pelo match
      # MAIS LONGO: a específica do tachyon-design vence a genérica.
      - name: Configurar acesso aos submodules
        env:
          TACHYON_DESIGN_KEY: ${{ secrets.TACHYON_DESIGN_DEPLOY_KEY }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TACHYON_DESIGN_KEY" > ~/.ssh/tachyon-design
          chmod 600 ~/.ssh/tachyon-design
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host github-tachyon-design
            HostName github.com
            IdentityFile ~/.ssh/tachyon-design
            IdentitiesOnly yes
          SSH_CONFIG

          git config --global \
            url."git@github-tachyon-design:allan-rcos/tachyon-design".insteadOf \
            "git@github.com:allan-rcos/tachyon-design"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Os bindings do FlatBuffers saíram do repositório (são saída de
      # compilador, não fonte), então o `flatc` passou a ser obrigatório aqui.
      # Binário oficial do release, para não compilar o projeto inteiro.
      - name: Instalar flatc
        env:
          FLATC_VERSION: '25.12.19'
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          unzip -q /tmp/flatc.zip -d /usr/local/bin
          chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Paraglide e flatc precisam rodar antes de tudo: lint, tipos e testes
      # importam `@/paraglide/messages` e `@/fbs/*`, ambos saída de compilador
      # que não existe no repo. (`gen:fbs` também é pré-passo dos scripts, mas
      # explicitá-lo aqui faz a falha aparecer no passo certo.)
      - name: Compilar i18n
        run: bun run i18n:compile

      - name: Gerar bindings FlatBuffers
        run: bun run gen:fbs

      - name: Contrato de i18n
        run: bun run i18n:check

      - name: Lint
        run: bun run lint

      - name: Tipos
        run: bun run typecheck

      - name: Testes
        run: bun run test

      - name: Build
        run: bun run build

      - name: Referência de API (TypeDoc)
        run: bun run docs:api
