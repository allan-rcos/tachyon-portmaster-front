# ============================================================
#  Integração contínua: roda em todo push e pull request.
#
#  O conteúdo deste arquivo encolheu porque as verificações deixaram de morar
#  aqui. `dagger call ci` roda a mesma sequência — i18n, lint, tipos, testes,
#  build, TypeDoc — e roda igual na máquina de quem desenvolve, que antes não
#  tinha como reproduzir nada disto sem um push.
#
#  A ordem continua sendo deliberada e continua documentada, só que em
#  dagger/src/index.ts: as verificações baratas e mais específicas primeiro,
#  para que um erro de lint não custe um build inteiro para aparecer.
#
#  O flatc também saiu daqui. Ele é instalado por dagger/modules/toolchain, onde
#  a versão é uma constante só — antes eram três cópias do mesmo número, uma
#  neste arquivo, uma no release.yml e uma no build-local.sh da infraestrutura.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixado na versão que os módulos de dagger/ declaram no dagger.json.
  DAGGER_VERSION: "0.21.8"

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # O checkout dos submódulos continua sendo trabalho do Actions, e é de
      # propósito: o Dagger recebe o diretório pronto e nunca clona nada por
      # conta própria. Toda a ginástica de credencial fica no único lugar onde
      # ela já funciona.
      #
      # O `.gitmodules` usa URLs SSH (git@github.com:), que o runner não tem
      # chave para resolver. A regra geral é reescrever para HTTPS e deixar o
      # token do Actions autenticar — o que basta para submodule PÚBLICO.
      #
      # O `tachyon-design` é privado, e aí a regra geral não serve: o token do
      # Actions só enxerga ESTE repositório, então o clone volta 404 ("not
      # found", e não "forbidden", porque o GitHub não confirma a existência de
      # repositório privado). Ele fica em SSH, com uma deploy key de leitura
      # própria, atrás de um alias de host — assim a chave vale só para ele e
      # nenhum outro clone SSH a usa por engano.
      #
      # As duas regras convivem porque o git desempata `insteadOf` pelo match
      # MAIS LONGO: a específica do tachyon-design vence a genérica.
      - name: Configurar acesso aos submodules
        env:
          TACHYON_DESIGN_KEY: ${{ secrets.TACHYON_DESIGN_DEPLOY_KEY }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TACHYON_DESIGN_KEY" > ~/.ssh/tachyon-design
          chmod 600 ~/.ssh/tachyon-design
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host github-tachyon-design
            HostName github.com
            IdentityFile ~/.ssh/tachyon-design
            IdentitiesOnly yes
          SSH_CONFIG

          git config --global \
            url."git@github-tachyon-design:allan-rcos/tachyon-design".insteadOf \
            "git@github.com:allan-rcos/tachyon-design"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: Verificar
        working-directory: dagger
        run: dagger call ci
