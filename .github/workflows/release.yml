# ============================================================
#  Release: a versão do package.json é a fonte da verdade.
#
#  Publicar é efeito de um commit revisado, não de uma tag empurrada à mão —
#  ninguém esquece de subir a versão nem publica fora de ordem.
#
#  A condição é "a tag v<version> ainda não existe", e NÃO "o package.json mudou
#  neste push". As duas concordam no caminho normal, mas só a primeira continua
#  certa quando uma run é re-executada, quando vários commits chegam juntos ou
#  quando o histórico é reescrito. Foi exatamente isso que falhou antes: com
#  `paths: package.json` e comparação contra HEAD~1, um force-push de histórico
#  reescrito não publicou a 1.0.0.
#
#  Publica dois artefatos do MESMO build:
#   • portmaster-dist-vX.Y.Z.zip — o `dist` pronto para rodar com `tjs`, mais o
#     .sha256 correspondente;
#   • ghcr.io/<owner>/portmaster:X.Y.Z — imagem montada a partir desse zip,
#     via Dockerfile.dist. Buildar a aplicação uma vez só é o que garante que
#     imagem e zip contêm exatamente o mesmo código.
# ============================================================
name: Release — zip e imagem GHCR quando a versão é nova

on:
  push:
    branches: [main]

# Dois pushes chegando juntos não podem ambos concluir que a tag falta e correr
# para criá-la. Sem `cancel-in-progress`: cancelar uma publicação pela metade
# deixaria release sem imagem.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write # criar a release e anexar o zip
  packages: write # publicar a imagem no GHCR

jobs:
  check-version:
    name: A versão é nova?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      # Checkout raso: nada aqui lê histórico — a pergunta sobre a tag é feita ao
      # remoto, não a este clone.
      - uses: actions/checkout@v4

      # `git ls-remote` em vez da lista local de tags, para a resposta ser o que
      # está de fato publicado e não o que este checkout por acaso baixou. O
      # build de 45 minutos só começa depois desta resposta.
      - id: check
        name: A tag desta versão já existe?
        run: |
          version="$(jq -r .version package.json)"
          [ -n "$version" ] && [ "$version" != null ] || {
            echo "::error::O package.json não declara version."; exit 1;
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v${version} já está publicada — nada a fazer. Suba a versão no package.json."
            exit 0
          fi

          # Guarda contra downgrade: a versão nova tem de ser a maior de todas as
          # já publicadas. `sort -V` para 1.10.0 vencer 1.9.0, que uma comparação
          # de texto erraria.
          highest="$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed -n 's#.*refs/tags/v\([0-9][^^]*\)$#\1#p' | sort -V | tail -1)"
          if [ -n "$highest" ] && \
             [ "$(printf '%s\n%s\n' "$version" "$highest" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::A versão desceu: v${highest} já está publicada e o package.json pede ${version}."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "v${version} ainda não tem tag — esta run publica."

  release:
    name: Publicar zip e imagem
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # o estágio do txiki compila do fonte
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      # Mesma configuração do `ci.yml`, e pelo mesmo motivo: HTTPS + token para
      # o submodule público, SSH com deploy key para o `tachyon-design`, que é
      # privado. O comentário longo está lá.
      - name: Configurar acesso aos submodules
        env:
          TACHYON_DESIGN_KEY: ${{ secrets.TACHYON_DESIGN_DEPLOY_KEY }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TACHYON_DESIGN_KEY" > ~/.ssh/tachyon-design
          chmod 600 ~/.ssh/tachyon-design
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host github-tachyon-design
            HostName github.com
            IdentityFile ~/.ssh/tachyon-design
            IdentitiesOnly yes
          SSH_CONFIG

          git config --global \
            url."git@github-tachyon-design:allan-rcos/tachyon-design".insteadOf \
            "git@github.com:allan-rcos/tachyon-design"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Os bindings do FlatBuffers saíram do repositório: sem `flatc` aqui, o
      # `gen:fbs` embutido nos scripts abaixo falha. Ver ci.yml.
      - name: Instalar flatc
        env:
          FLATC_VERSION: '25.12.19'
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          unzip -q /tmp/flatc.zip -d /usr/local/bin
          chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Rede de segurança: uma versão nunca deve ser publicada sem a suíte
      # verde, mesmo que o commit de bump tenha vindo por um caminho que pulou o CI.
      - name: Verificar antes de publicar
        run: |
          bun run i18n:compile
          bun run gen:fbs
          bun run i18n:check
          bun run lint
          bun run typecheck
          bun run test

      - name: Build
        run: bun run build

      # O que roda é só `dist/txiki/server.mjs` mais o `dist/client`, que ele
      # alcança por `../client/` a partir do próprio `import.meta.url`. O resto
      # é entrada de build: `dist/server` já foi embutido no bundle pelo
      # `Bun.build` do adapter, e `fbs`/`paraglide` chegaram aos assets pelos
      # aliases do Vite. Podar aqui, antes do zip E da imagem, mantém os dois
      # com exatamente o mesmo conteúdo.
      - name: Enxugar o dist para o que roda
        run: |
          rm -rf dist/server dist/fbs dist/paraglide dist/assets.json
          du -sh dist

      # O .sha256 vai junto porque a infra que consome o zip precisa conferir o
      # download; sem ele, o hash tem de ser fixado à mão a cada subida.
      - name: Empacotar o dist
        run: |
          zip -r "portmaster-dist-v${VERSION}.zip" dist
          sha256sum "portmaster-dist-v${VERSION}.zip" > "portmaster-dist-v${VERSION}.zip.sha256"

      # `--target` fixa a tag no commit que ESTE build compilou; sem ele o `gh`
      # a criaria no topo do branch, que pode já ter andado.
      - name: Criar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "portmaster-dist-v${VERSION}.zip" \
            "portmaster-dist-v${VERSION}.zip.sha256" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes

      - uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Usa o Dockerfile.dist: a imagem empacota o `dist` que acabou de ser
      # publicado, em vez de rebuildar a aplicação e arriscar divergência.
      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portmaster:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/portmaster:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
